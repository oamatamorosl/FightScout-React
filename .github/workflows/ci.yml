name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ---------- JOB 1: INTEGRACIÓN CONTINUA ----------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar la aplicación
        run: pnpm run build

      - name: Guardar el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # ---------- JOB 2: DESPLIEGUE CONTINUO ----------
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el artefacto del build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Autenticarse con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar archivos con S3
        run: aws s3 sync dist s3://${{ vars.S3_BUCKET }} --delete