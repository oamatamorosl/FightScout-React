name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Permite lanzar el workflow a mano desde la pestaña Actions (para el despliegue a S3)
  workflow_dispatch:

jobs:
  # ---------- JOB 1: INTEGRACIÓN CONTINUA ----------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad del código (lint)
        run: pnpm run lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Compilar la aplicación (incluye chequeo de tipos con tsc)
        run: pnpm run build
        env:
          # URL pública del Worker (variable del repo, NO secret). Sin ella, el build usa el simulador.
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}

      - name: Guardar el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # ---------- JOB 2: DESPLIEGUE CONTINUO (opcional, solo manual) ----------
  # Las credenciales de AWS Academy caducan en cada sesión del Learner Lab.
  # Por eso este job NO corre en cada push: solo cuando lo lanzas a mano
  # (Actions -> CI/CD -> Run workflow) después de actualizar los secrets.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el artefacto del build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Autenticarse con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar archivos con S3
        run: aws s3 sync dist s3://${{ vars.S3_BUCKET }} --delete